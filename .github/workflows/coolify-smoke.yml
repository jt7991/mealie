name: Coolify Docker Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build production container from the checkout
        run: docker build --file docker/Dockerfile --tag mealie:coolify .
      - name: Check frontend, authentication, migration, and persistence
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name mealie-smoke \
            -p 127.0.0.1:9000:9000 -v mealie-smoke-data:/app/data \
            -e BASE_URL=http://localhost:9000 -e ALLOW_SIGNUP=true \
            -e TOKEN_TIME=8760 -e MAGIC_LINK_ENABLED=true \
            -e SMTP_HOST=smtp.resend.com -e SMTP_PORT=465 \
            -e SMTP_AUTH_STRATEGY=SSL -e SMTP_USER=resend \
            -e SMTP_PASSWORD=build-smoke-only -e SMTP_FROM_EMAIL=recipes@example.com \
            mealie:coolify
          ready() {
            for attempt in $(seq 1 90); do
              if curl -fsS http://localhost:9000/api/app/about -o /tmp/mealie-about.json; then
                return 0
              fi
              sleep 2
            done
            return 1
          }
          ready
          jq -e '.production and .enableMagicLink and .allowSignup and .tokenTime == 8760' /tmp/mealie-about.json
          curl -fsS http://localhost:9000/login -o /tmp/mealie-login.html
          asset=$(grep -oE 'src="/_nuxt/[^" ]+\.js"' /tmp/mealie-login.html | head -1 | cut -d '"' -f 2)
          test -n "$asset"
          curl -fsS "http://localhost:9000$asset" -o /dev/null
          curl -fsS -D /tmp/mealie-headers -c /tmp/mealie-cookies \
            -d 'username=changeme@example.com&password=MyPassword&remember_me=true' \
            http://localhost:9000/api/auth/token -o /tmp/mealie-token.json
          jq -e '.expires_in == 31536000' /tmp/mealie-token.json
          grep -qi 'Max-Age=31536000' /tmp/mealie-headers
          curl -fsS -b /tmp/mealie-cookies http://localhost:9000/api/users/self | jq -e '.admin'
          docker restart mealie-smoke
          ready
          curl -fsS -b /tmp/mealie-cookies http://localhost:9000/api/users/self | jq -e '.admin'
      - name: Container logs on failure
        if: failure()
        run: docker logs mealie-smoke || true
